<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tools Hub</title>
    <link rel="icon" href="icons/hub.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__brand">
        <img class="site-header__icon" src="icons/hub.svg" width="22" height="22" alt="" />
        <p class="label">tools hub</p>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" class="display">Инструменты</h1>
        <p id="hero-lead" class="hero__lead">
          Утилиты в браузере — без установки и регистрации.
        </p>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog__head">
          <h2 id="catalog-title" class="h1">Каталог</h2>
          <label class="search-field">
            <span class="label">поиск</span>
            <input
              id="tool-search"
              class="search-field__input"
              type="search"
              placeholder="SQL, JSON, EXPLAIN…"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>
        <p id="catalog-status" class="body secondary" hidden>Загрузка…</p>
        <div id="tools-grid" class="tools-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="body secondary">Данные обрабатываются локально в браузере</p>
    </footer>

    <script src="hub.js"></script>
  </body>
</html>
